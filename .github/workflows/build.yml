name: Compilar APK SAMP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Clonar código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Dar permisos de ejecución
      run: chmod +x gradlew

    - name: Asegurar archivo AAR en libs
      run: |
        mkdir -p app/libs
        git add -f app/libs/*.aar || true

    - name: Limpiar y compilar el APK con Gradle
      run: ./gradlew clean assembleDebug --stacktrace

    - name: Subir APK generado
      uses: actions/upload-artifact@v4
      with:
        name: SAMP-APK-Debug
        path: app/build/outputs/apk/debug/*.apk
